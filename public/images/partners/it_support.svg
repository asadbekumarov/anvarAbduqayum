<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="itBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="itCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- IT Support Brand Mark: Modern Terminal Brackets & Network Core -->
  <g transform="translate(8, 10)">
    <!-- Tech Frame / Terminal Box -->
    <rect x="4" y="4" width="32" height="32" rx="6" fill="#0F172A" stroke="url(#itBlue)" stroke-width="1.8"/>
    <!-- Code Brackets { } or < / > -->
    <path d="M14 14 L9 20 L14 26" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 14 L31 20 L26 26" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 13 L18 27" stroke="url(#itBlue)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="1.5" fill="#60A5FA"/>
  </g>

  <!-- Typography: IT SUPPORT -->
  <text x="54" y="32" font-family="'JetBrains Mono', Consolas, monospace" font-weight="800" font-size="20" letter-spacing="1" fill="#FFFFFF">
    IT SUPPORT
  </text>
  <!-- Subtitle: & SERVICE // ERP -->
  <text x="55" y="46" font-family="monospace, sans-serif" font-weight="700" font-size="8.5" letter-spacing="2.2" fill="#38BDF8">
    &amp; SERVICE // SYSTEMS
  </text>
</svg>
