<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="uzGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="uzAzure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <!-- UZBIC Brand Mark: Geometric 8-Point Rub-el-Hizb Council Star & Gear Shield -->
  <g transform="translate(8, 10)">
    <!-- 8-Point Star / Council Emblem -->
    <rect x="7" y="7" width="26" height="26" rx="2" fill="#0C4A6E" stroke="url(#uzGold)" stroke-width="1.8"/>
    <rect x="7" y="7" width="26" height="26" rx="2" fill="none" stroke="url(#uzGold)" stroke-width="1.8" transform="rotate(45 20 20)"/>
    <!-- Inner Global Trade / Industry Node -->
    <circle cx="20" cy="20" r="5" fill="url(#uzGold)"/>
    <circle cx="20" cy="20" r="2.5" fill="#0C4A6E"/>
  </g>

  <!-- Typography: UZBIC -->
  <text x="54" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2.5" fill="#FFFFFF">
    UZBIC
  </text>
  <!-- Subtitle: BUSINESS COUNCIL -->
  <text x="55" y="46" font-family="monospace, sans-serif" font-weight="700" font-size="8.5" letter-spacing="2.4" fill="#FDE047">
    BUSINESS COUNCIL
  </text>
  <!-- Flag Accent Line -->
  <rect x="180" y="24" width="2" height="18" fill="#38BDF8"/>
  <rect x="184" y="24" width="2" height="18" fill="#FFFFFF"/>
  <rect x="188" y="24" width="2" height="18" fill="#22C55E"/>
</svg>
