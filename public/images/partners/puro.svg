<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="prGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="prCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <!-- Puro Brand Mark: Artisanal Italian Crown / Gelato Swirl -->
  <g transform="translate(8, 10)">
    <!-- Gelato Cone / Chalice -->
    <path d="M12 24 L20 38 L28 24 Z" fill="url(#prGold)" stroke="#A16207" stroke-width="0.8"/>
    <!-- Artisanal Cream Swirl / Wave -->
    <path d="M8 22 C8 16 14 12 20 12 C26 12 32 16 32 22 C29 20 25 21 20 21 C15 21 11 20 8 22 Z" fill="url(#prCyan)"/>
    <circle cx="20" cy="9" r="3" fill="#FDE047"/>
    <!-- Delicate Filigree Crown Peak -->
    <path d="M14 15 L20 4 L26 15" stroke="url(#prGold)" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Typography: PURO -->
  <text x="54" y="32" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="23" letter-spacing="4" fill="#FFFFFF">
    PURO
  </text>
  <!-- Subtitle: GELATERIA ARTIGIANALE -->
  <text x="55" y="46" font-family="system-ui, sans-serif" font-weight="600" font-size="7.5" letter-spacing="3.2" fill="#FDE047">
    GELATERIA // ARTIGIANALE
  </text>
</svg>
