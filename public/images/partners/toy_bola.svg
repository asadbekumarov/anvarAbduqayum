<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="tbCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="tbRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <!-- Toybola Brand Mark: Interlocking Precision Toy Bricks / Molded Cube -->
  <g transform="translate(6, 10)">
    <!-- 3D Isometric Toy Bricks with precision injection pin hallmarks -->
    <!-- Top Block (Gold) -->
    <path d="M20 2 L36 11 L20 20 L4 11 Z" fill="url(#tbGold)"/>
    <ellipse cx="20" cy="11" rx="4" ry="2.2" fill="#FEF08A"/>
    <!-- Left Face (Cyan) -->
    <path d="M4 11 L20 20 L20 38 L4 29 Z" fill="url(#tbCyan)"/>
    <!-- Right Face (Ruby Red) -->
    <path d="M20 20 L36 11 L36 29 L20 38 Z" fill="url(#tbRed)"/>
    <!-- Precision highlights -->
    <path d="M20 20 L20 38" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.4"/>
  </g>

  <!-- Typography: TOYBOLA -->
  <text x="54" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="1.5" fill="#FFFFFF">
    TOYBOLA
  </text>
  <!-- Subtitle: TOYS & PLASTICS -->
  <text x="55" y="46" font-family="monospace, sans-serif" font-weight="700" font-size="8.5" letter-spacing="2.8" fill="#EAB308">
    TOYS // PLASTICS
  </text>
  <!-- Micro Registration Dot -->
  <circle cx="218" cy="24" r="2" fill="#EAB308"/>
</svg>
