<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="smHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="smGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Samtech Brand Mark: Hexagonal Polymer Lattice & Molecular Nodes -->
  <g transform="translate(8, 10)">
    <!-- Hexagon Outer -->
    <polygon points="20,2 35,11 35,29 20,38 5,29 5,11" fill="none" stroke="url(#smHex)" stroke-width="2.4"/>
    <!-- Inner Triple Node (Polymer Compound / Masterbatch concentrate) -->
    <circle cx="20" cy="11" r="3" fill="#34D399"/>
    <circle cx="12" cy="25" r="3" fill="url(#smGold)"/>
    <circle cx="28" cy="25" r="3" fill="#6EE7B7"/>
    <line x1="20" y1="11" x2="12" y2="25" stroke="#34D399" stroke-width="1.5"/>
    <line x1="20" y1="11" x2="28" y2="25" stroke="#34D399" stroke-width="1.5"/>
    <line x1="12" y1="25" x2="28" y2="25" stroke="url(#smGold)" stroke-width="1.5"/>
  </g>

  <!-- Typography: SAMTECH -->
  <text x="54" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="21" letter-spacing="2" fill="#FFFFFF">
    SAMTECH
  </text>
  <!-- Subtitle: MASTERBATCHES -->
  <text x="55" y="46" font-family="monospace, sans-serif" font-weight="700" font-size="8.5" letter-spacing="2.6" fill="#34D399">
    MASTERBATCHES
  </text>
  <!-- Industrial division badge -->
  <rect x="200" y="22" width="24" height="12" rx="2" fill="#064E3B" stroke="#059669" stroke-width="0.8"/>
  <text x="212" y="31" font-family="monospace, sans-serif" font-weight="700" font-size="7" fill="#34D399" text-anchor="middle">B2B</text>
</svg>
